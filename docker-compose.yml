version: '3.8'

services:
  webrtc-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      STUN_SERVERS: "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"
      TURN_SERVERS: ""
      WS_PATH: "/ws"
      WS_READ_BUFFER: "1024"
      WS_WRITE_BUFFER: "1024"
      WS_MAX_CONNECTIONS: "1000"
      AUDIO_ENABLED: "true"
      VIDEO_ENABLED: "true"
      VIDEO_CODEC: "VP8"
      AUDIO_CODEC: "OPUS"
      MAX_PEERS_PER_ROOM: "10"
      DEFAULT_ROOM_TIMEOUT: "3600"
      ALLOW_ANONYMOUS: "true"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
    volumes:
      - ./web:/root/web
    networks:
      - webrtc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy for HTTPS
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - webrtc-server
    networks:
      - webrtc-network
    restart: unless-stopped
    profiles:
      - proxy

networks:
  webrtc-network:
    driver: bridge
